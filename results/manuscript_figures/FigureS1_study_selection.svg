   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243447" x="7.2" y="17.860027" transform="rotate(-0 7.2 17.860027)">a</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243447" x="24.61824" y="17.496013" transform="rotate(-0 24.61824 17.496013)">Programme derivation and prespecification</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4c78a8" x="33.576192" y="51.273866" transform="rotate(-0 33.576192 51.273866)">GSE231802 perturbation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 67.041049)">Mouse enteric glia</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 74.123685)">3 conditions x 3 time points</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 81.15476)">n = 4 per group/time</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4c78a8" x="202.781952" y="51.273866" transform="rotate(-0 202.781952 51.273866)">Time-consistent response</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(202.781952 67.077611)">log2FC &gt; 0.5 and BH FDR &lt; 0.05</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(202.781952 74.114779)">at two or more time points</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(202.781952 81.127103)">33 genes retained</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2a9d8f" x="371.987712" y="51.273866" transform="rotate(-0 371.987712 51.273866)">Frozen cross-platform scaffold</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(371.987712 67.049955)">13 genes measured by both</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(371.987712 74.151342)">CosMx panel versions</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(371.987712 81.75101)">Frozen before human tests</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243447" x="7.2" y="112.964251" transform="rotate(-0 7.2 112.964251)">b</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243447" x="24.61824" y="112.600237" transform="rotate(-0 24.61824 112.600237)">Human validation resources and analysis units</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #c58a24" x="33.576192" y="138.31841" transform="rotate(-0 33.576192 138.31841)">CRC Atlas input</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 154.301218)">4,264,929 cells</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 161.367448)">15,352 annotated Schwann cells</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 168.206804)">279 patients, 560 samples, 32 studies</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #b24a3b" x="192.828672" y="138.31841" transform="rotate(-0 192.828672 138.31841)">Eligibility and independence</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 154.157311)">Excluded Lee_2020_Nat_Genet</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 161.124167)">Primary tumour + adjacent normal</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 168.794147)">&gt;=5 Schwann cells in each tissue</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #c58a24" x="352.081152" y="138.31841" transform="rotate(-0 352.081152 138.31841)">Primary validation set</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 154.120749)">44 paired patients</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 161.168229)">9 independent studies</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 168.23446)">Patient pair = inferential unit</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2a9d8f" x="33.576192" y="209.243594" transform="rotate(-0 33.576192 209.243594)">CosMx GSE303070</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 225.254058)">846,469 cells; 352 fields of view</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 232.294507)">803,109 cells after author QC</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 239.159644)">29,829 Schwann cells; 24 specimens</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 246.170562)">16 donors; 8 paired donors</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4c78a8" x="192.828672" y="209.243594" transform="rotate(-0 192.828672 209.243594)">GSE132465</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 225.019683)">305 enteric-glial cells</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 232.058257)">&gt;=3 cells per patient-tissue summary</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(192.828672 239.30355)">12 summaries: 3 tumour, 9 normal</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4c78a8" x="352.081152" y="209.243594" transform="rotate(-0 352.081152 209.243594)">GSE144735</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 225.019683)">463 enteric-glial cells</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 232.058257)">&gt;=3 cells per patient-tissue summary</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(352.081152 239.30355)">9 summaries: 3 tumour, 6 normal</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243447" x="33.576192" y="285.004586" transform="rotate(-0 33.576192 285.004586)">Inference hierarchy</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 300.810206)">Programme generator: culture replicate   |   Primary test: paired patient   |   Orthogonal test: paired donor   |   Supportive tests: patient-tissue summary</text>
    <text style="font-size: 6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243447" transform="translate(33.576192 307.846905)">Cells contribute to aggregate scores; they do not enter inferential tests as independent replicates.</text>
   </g>
  </g>
